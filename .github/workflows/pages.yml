name: Publish the site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the build
        run: |
          test -f site/index.html && test -f site/MANIFEST.md
          grep -q "window.BD_PUBLIC=true" site/index.html
          if find site -path '*/tiles/edm/l_*' | grep -q .; then echo "Edmonton lot outline tiles found: not publishing"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
